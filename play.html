<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>gcdatlas</title>
<base href="vendor/">
<link rel="stylesheet" href="atlas.css">
<link rel="prefetch" href="LICENSE.txt">
<script src="/sandbox/_ready.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<button id="ui-toggle" type="button" aria-label="Tours and notes" aria-expanded="false">&#9776;</button>
<div id="panel">
  <p id="place">Earth</p>
  <p id="range"></p>
  <p id="fact"></p>
  <div id="tours">
    <button type="button" data-go="earth">Earth</button>
    <button type="button" data-go="moon">Moon</button>
    <button type="button" data-go="pair">Earth &amp; Moon</button>
    <button type="button" data-go="sun">Sun</button>
    <button type="button" data-go="planets">Planets</button>
    <button type="button" data-go="galaxy">Milky Way</button>
    <button type="button" data-go="core">The Core</button>
    <button type="button" data-go="edge">The Edge</button>
  </div>
</div>
<p id="hint">Drag to look · pinch to zoom · double-tap a world<small>idea after @eshin087 (eshin087/gcdatlas); clean-room implementation, no code copied</small></p>
<script src="atlas.js"></script>
</body>
</html>
